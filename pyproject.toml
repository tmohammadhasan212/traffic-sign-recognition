[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-signs"
version = "0.1.0"
description = "Reproducible and uncertainty-aware GTSRB classification"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.3,<3", "torchvision>=0.18,<1", "numpy>=1.26,<3",
  "Pillow>=10,<13", "PyYAML>=6,<7", "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI's File(...) is a deliberate dependency declaration.
