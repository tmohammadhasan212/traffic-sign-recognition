<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic sign demo</title><style>
body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;color:#172234;background:#f7fafc}main{background:white;padding:2rem;border-radius:1rem;box-shadow:0 3px 20px #d9e2ea}button{background:#174c83;color:white;border:0;padding:.7rem 1rem;border-radius:.5rem;cursor:pointer}img{max-width:100%;max-height:300px;border-radius:.5rem}#result{white-space:pre-wrap}small{color:#674b00}</style></head><body><main><h1>Traffic sign recognition</h1><p>Upload a cropped sign image for a 43-class prediction.</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/x-portable-pixmap"><p><img id="preview" alt="Selected image" hidden></p><button id="submit">Predict</button><p id="result" role="status"></p><img id="cam" alt="Grad-CAM heatmap" hidden><p><small>Research/educational demo; never use as a driving safety system. Grad-CAM is suggestive, not causal proof.</small></p></main><script>
const input=document.getElementById('file'), preview=document.getElementById('preview'), cam=document.getElementById('cam'), result=document.getElementById('result');
input.onchange=()=>{if(input.files[0]){preview.src=URL.createObjectURL(input.files[0]);preview.hidden=false;cam.hidden=true;result.textContent='';}};
document.getElementById('submit').onclick=async()=>{if(!input.files[0]){result.textContent='Choose an image first.';return;}const body=new FormData();body.append('file',input.files[0]);result.textContent='Predicting…';try{const response=await fetch('/predict',{method:'POST',body});const data=await response.json();if(!response.ok)throw Error(data.detail||'Prediction failed');result.textContent=`${data.predicted_class}\nConfidence: ${(100*data.confidence).toFixed(1)}%\n${data.uncertain?'Uncertain: abstain':'Prediction accepted'}\nLatency: ${data.inference_time_ms.toFixed(1)} ms\nTop 3:\n`+data.top_3_predictions.map(x=>`• ${x.class_name}: ${(100*x.probability).toFixed(1)}%`).join('\n');const heat=await fetch('/explain',{method:'POST',body});if(heat.ok){cam.src=URL.createObjectURL(await heat.blob());cam.hidden=false;}}catch(error){result.textContent=error.message;}};
</script></body></html>
